[project]
name = "quotabubble"
version = "0.2.5"
description = "A lightweight cross-platform floating widget that shows AI usage quotas."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Izzet Yildirim", email = "izzet@izzet.dev" }]
keywords = [
    "ai",
    "usage",
    "quota",
    "claude-code",
    "codex",
    "copilot",
    "cursor",
    "opencode",
    "antigravity",
    "deepseek",
    "openrouter",
    "kimi",
    "zai",
    "grok",
    "zed",
    "desktop-widget",
    "pyside6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "httpx2>=2.12",
    "keyring>=24.0",
    "platformdirs>=4.0",
    "pydantic>=2.0",
    # PySide6 6.10+ ships macOS 13+ wheels only. Keep macOS 12 Intel support
    # while this remains a supported release target.
    "pyside6>=6.7,<6.10",
    "pyobjc-framework-Security>=12.0; sys_platform == 'darwin'",
    "dbus-fast>=5.0.22; sys_platform == 'linux'",
]

[project.gui-scripts]
quota-panel = "quotabubble.app.taskbar_main:main"
quotabubble = "quotabubble.app.main:main"
quotabubble-settings = "quotabubble.settings_main:main"

[project.scripts]
quotabubble-service = "quotabubble.service.main:main"

[project.urls]
Homepage = "https://izzet.github.io/quotabubble/"
Repository = "https://github.com/izzet/quotabubble"
Issues = "https://github.com/izzet/quotabubble/issues"
Changelog = "https://github.com/izzet/quotabubble/releases"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotabubble"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.coverage.run]
source = ["src/quotabubble"]
# Composition root only -- see AGENTS.md's "main.py is composition, not logic"
# policy. Any real logic belongs in a tested module instead, not here.
omit = ["src/quotabubble/app/main.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Ratchet this up as coverage improves; current baseline is ~84%.
fail_under = 80
