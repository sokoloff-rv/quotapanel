name: release

# Every push to master rebuilds QuotaPanel and replaces the single rolling
# "latest" release, so the newest build is always at
# https://github.com/sokoloff-rv/quotapanel/releases/latest
on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "website/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes a build that is still running.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv run pyinstaller --noconfirm packaging/quotapanel.windows.spec

      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/QuotaPanel/
          Compress-Archive -Path dist/QuotaPanel/* -DestinationPath QuotaPanel-windows-x64.zip

      - name: Publish rolling release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(git rev-parse --short HEAD)
          subject=$(git log -1 --format=%s)
          notes="Build of \`${short}\`: ${subject}

          Unzip and run \`QuotaPanel.exe\`. Keep the \`_internal\` folder next to it."
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest QuotaPanel-windows-x64.zip \
            --target "$GITHUB_SHA" \
            --title "QuotaPanel (latest build)" \
            --notes "$notes" \
            --latest
