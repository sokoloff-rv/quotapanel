name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            coverage: true
            coverage_flag: windows
          - os: macos-15-intel
            coverage: true
            coverage_flag: macos-x64
          - os: macos-15
            coverage: false
          - os: ubuntu-24.04
            coverage: true
            coverage_flag: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        if: ${{ !matrix.coverage }}
        run: uv run pytest -q

      - name: Test with coverage
        if: matrix.coverage
        run: uv run pytest -q --cov=src/quotabubble --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: ${{ matrix.coverage_flag }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
